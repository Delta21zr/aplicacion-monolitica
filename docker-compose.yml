version: '3.8'

services:
  # Base de Datos Relacional (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: monolito-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: user_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Base de Datos de Documentos (MongoDB para Catálogo)
  mongodb:
    image: mongo:6-jammy
    container_name: monolito-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Base de Datos en Memoria (Redis para Carrito)
  redis:
    image: redis:7-alpine
    container_name: monolito-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Broker de Mensajería (RabbitMQ para Telemetría y Health Status)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: monolito-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
